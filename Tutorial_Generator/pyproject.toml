[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorial-generator"
version = "0.1.0"
description = "A web-research agent that creates beginner-friendly tutorial PDFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.24.0,<4.0.0",
    "openai-agents>=0.2.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "reportlab>=4.2.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pypdf>=5.0.0,<7.0.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tutorial-generator = "tutorial_generator.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
